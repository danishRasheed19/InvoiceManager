server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: participant-service
          uri: lb://participant-service
          predicates:
            - Path=/participants/**

        - id: invoice-service
          uri: lb://invoice-service
          predicates:
            - Path=/invoices/**

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka